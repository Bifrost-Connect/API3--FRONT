<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chamados</title>
    <link rel="stylesheet" href="css/componentes.css" />
    <link rel="stylesheet" href="css/chamados.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  </head>

  <body class="pagina-chamados">
    <div id="topbar-container"></div>

    <div id="sidebar-container"></div>

    <div class="mapa-card">
      <h2 class="mapa-titulo">Mapa de Chamados</h2>
      <div id="mapaChamados" class="mapa-container"></div>
      <div class="mapa-instrucoes">
        Clique nos marcadores para ver os detalhes do chamado.
      </div>
    </div>

    <div class="chamado-card">
      <h2 class="chamado-titulo">Detalhes do Chamado</h2>

      <div class="chamado-conteudo"></div>

      <button class="btn-aceitar" onclick="abrirModalConfirmacao()">
        Aceitar chamado
      </button>
    </div>

    <div id="modalConfirmacao" class="sobreposicao">
        <div class="popup-card">
            <h2 class="popup-titulo">Veículos Disponíveis</h2>

            <div class="container-pesquisa">
                <input type="text" id="inputPesquisa" placeholder="Pesquisar por nome ou placa..."
                    onkeyup="filtrarVeiculos()">
                <button class="btn-filtro-abrir" onclick="abrirModalFiltro()" title="Filtros Avançados">
                    <img src="https://cdn-icons-png.flaticon.com/512/57/57164.png" alt="Filtro">
                </button>
            </div>

            <div id="listaVeiculos" class="lista-veiculos"></div>
        </div>
    </div>

    <div id="modalFiltroAvancado" class="sobreposicao">
        <div class="popup-card popup-filtro-menor">
            <h2 class="popup-titulo">Filtros</h2>

            <div class="grupo-filtro">
                <label for="filtroTipo">Tipo de Veículo</label>
                <select id="filtroTipo">
                    <option value="TODOS">Todos os tipos</option>
                    <option value="PASSEIO">Passeio</option>
                    <option value="UTILITÁRIO">Utilitário</option>
                </select>
            </div>

            <div class="btn-container">
                <button class="btn-voltar" onclick="fecharModalFiltro()">Cancelar</button>
                <button class="btn-aceitar" onclick="aplicarFiltros()">Aplicar Filtros</button>
            </div>
        </div>
    </div>

    <div id="modalDetalhesVeiculo" class="sobreposicao">
        <div class="popup-card">
            <div class="popup-detalhes-layout">
                <div class="popup-detalhes-info">
                    <h2 class="popup-titulo" id="tituloVeiculo">Detalhes do Veículo</h2>

                    <div class="popup-conteudo" id="conteudoVeiculo">
                        <p><strong>Modelo:</strong> <span id="modeloVeiculo"></span></p>
                        <p><strong>Marca:</strong> <span id="marcaVeiculo"></span></p>
                        <p><strong>Tipo de Veículo:</strong> <span id="tipoVeiculo"></span></p>
                        <p><strong>Prefixo da Viatura:</strong> <span id="prefixoVeiculo"></span></p>
                        <p><strong>Placa:</strong> <span id="placaVeiculo"></span></p>
                        <p><strong>Último Serviço:</strong> <span id="ultimoServico"></span></p>
                        <p><strong>Quilometragem:</strong> <span id="quilometragem"></span></p>
                    </div>

                    <div class="btn-container">
                        <button class="btn-voltar" onclick="voltarParaVeiculos()">
                            ← Voltar
                        </button>
                        <button class="btn-aceitar" onclick="confirmarVeiculo()">
                            Confirmar
                        </button>
                    </div>
                </div>
                <div class="popup-detalhes-imagem">
                    <img src="img/carro 1.jpg" alt="Imagem do veículo">
                </div>
            </div>
        </div>
    </div>

    <div id="toast-aviso" class="toast-hidden">Preencha todos os campos!</div>
    <div id="toast-aviso1" class="toast-hidden1">Preencha todos os campos!</div>

    <script src="js/basic.js"></script>
    <script src="js/componentes.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/vehicle.js"></script>
    <script src="js/service.js"></script>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="js/mapa-chamados.js"></script>
    <script>
        injetarLayout("Chamados");
    </script>
  </body>
</html>
